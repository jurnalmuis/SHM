<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta http-equiv="pragma" content="no-cache">
    <meta http-equiv="expires" content="-1">
    <title>Error - Simple Hotspot MikroTik</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-dark">
    <div class="auth-wrap">
        <div class="auth-card">
            <header class="auth-header rounded-top d-flex align-items-center text-white">
                <img src="img/internet.png" class="hotspot-logo mr-3" alt="Ikon Hotspot MikroTik">
                <strong>Terjadi Kesalahan.</strong>
            </header>
            <main class="auth-body bg-light rounded-bottom">
                <p class="text-danger font-weight-bold mb-3">Hotspot ERROR: $(error)</p>
                <a href="$(link-login)" class="btn btn-info btn-auth w-100">Kembali ke Halaman Login</a>
            </main>
            <footer class="auth-footer text-center text-white">
                <small>Login page: <a href="$(link-login)" class="font-weight-bold">$(link-login)</a></small>
            </footer>
        </div>
    </div>
</body>
</html>
