<!DOCTYPE html>
<html lang="id">
<head>
	<meta http-equiv="refresh" content="2; url=status.html">
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta http-equiv="pragma" content="no-cache">
	<meta http-equiv="expires" content="-1">
	<title>Redirect - Simple Hotspot MikroTik</title>
	<link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="shortcut icon" href="img/internet.png">
<script language="JavaScript">
    function startClock() {
        $(if popup == 'true')
        open('$(link-status)', 'hotspot_status', 'toolbar=0,location=0,directories=0,status=0,menubars=0,resizable=1,width=290,height=200');
	$(endif)
	location.href = unescape('status.html');
    }
</script>
</head>
<body onLoad="startClock()" class="bg-dark">
	<div class="auth-wrap">
        <div class="auth-card">
            <header class="auth-header rounded-top d-flex align-items-center text-white">
                <img src="img/internet.png" class="hotspot-logo mr-3" alt="Ikon Hotspot MikroTik">
                <strong>Silahkan Tunggu.</strong>
            </header>
            <main class="auth-body bg-light rounded-bottom text-center">
                <p class="py-4 mb-0">
                    Login Hotspot Berhasil.<br class="d-sm-none">
                    <strong>Silahkan Tunggu...</strong>
                </p>
            </main>
            <footer class="auth-footer text-center text-white">
                <small>&copy; 2019 <a href="https://jurnalmuis.github.io/" target="_blank" class="font-weight-bold">jurnalmuis.github.io</a></small>
            </footer>
        </div>
    </div>
</body>
</html>
