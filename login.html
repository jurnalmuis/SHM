<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Login - Simple Hotspot MikroTik</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="shortcut icon" href="img/internet.png">
</head>
<body class="bg-dark">
    $(if chap-id)
    <form name="sendin" action="$(link-login-only)" method="post">
        <input type="hidden" name="username" />
        <input type="hidden" name="password" />
        <input type="hidden" name="dst" value="$(link-orig)" />
        <input type="hidden" name="popup" value="true" />
    </form>
    
    <script type="text/javascript" src="/md5.js"></script>
    <script type="text/javascript">
    //
        function doLogin() {
        document.sendin.username.value = document.login.username.value;
        document.sendin.password.value = hexMD5('$(chap-id)' + document.login.password.value + '$(chap-challenge)');
        document.sendin.submit();
        return false;
        }
    //-->
    </script>
    $(endif)
    <div class="auth-wrap">
        <div class="auth-card">
            <header class="auth-header rounded-top d-flex align-items-center text-white">
                <img src="img/internet.png" class="hotspot-logo mr-3" alt="Ikon Hotspot MikroTik">
                <strong>Silahkan Login.</strong>
            </header>
            <main class="auth-body bg-light rounded-bottom">
                <form name="login" action="$(link-login-only)" method="post" class="auth-form" $(if chap-id) onSubmit="return doLogin()" $(endif)>
                    <input type="hidden" name="dst" value="$(link-orig)" />
                    <input type="hidden" name="popup" value="true" />
                    <div class="form-group">
                        <label class="mb-1">Username</label>
                        <input name="username" type="text" class="form-control" autofocus autocomplete="username" required>
                    </div>
                    <div class="form-group">
                        <label class="mb-1">Password</label>
                        <input name="password" type="password" class="form-control" autocomplete="current-password" required>
                    </div>
                    $(if error)<div class="text-danger mb-3" role="alert">$(error)</div>$(endif)
                    <button type="submit" class="btn btn-info btn-auth w-100">Login</button>
                </form>
            </main>
            <footer class="auth-footer text-center text-white">
                <small>&copy; 2019 <a href="https://jurnalmuis.github.io/" target="_blank" class="font-weight-bold">jurnalmuis.github.io</a></small>
            </footer>
        </div>
    </div>
    <script type="text/javascript">
    //
    document.login.username.focus();
    //-->
    </script>
</body>
</html>
