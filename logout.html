<!DOCTYPE html>
<html lang="id">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta http-equiv="pragma" content="no-cache">
	<meta http-equiv="expires" content="-1">
	<title>Logout - Simple Hotspot MikroTik</title>
	<link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="shortcut icon" href="img/internet.png">
</head>
<body class="bg-dark">
<script language="JavaScript">
<!--
    function openLogin() {
	if (window.name != 'hotspot_logout') return true;
	open('$(link-login)', '_blank', '');
	window.close();
	return false;
    }
//-->
</script>
<div class="auth-wrap">
        <div class="auth-card">
            <header class="auth-header rounded-top d-flex align-items-center text-white">
                <img src="img/internet.png" class="hotspot-logo mr-3" alt="Ikon Hotspot MikroTik">
                <strong>Logout Hotspot.</strong>
            </header>

            <form action="$(link-login)" name="login" onSubmit="return openLogin()">
                <main class="auth-body bg-light rounded-bottom">
                    <div class="text-center font-weight-bold mb-3">Anda Sudah Keluar Dari Hotspot</div>
                    <dl class="mb-3">
                        <div class="auth-meta">
                            <dt class="k">user name:</dt>
                            <dd class="v mb-0">$(username)</dd>
                        </div>
                        <div class="auth-meta">
                            <dt class="k">IP address:</dt>
                            <dd class="v mb-0">$(ip)</dd>
                        </div>
                        <div class="auth-meta">
                            <dt class="k">MAC address:</dt>
                            <dd class="v mb-0">$(mac)</dd>
                        </div>
                        <div class="auth-meta">
                            <dt class="k">session time:</dt>
                            <dd class="v mb-0">$(uptime)</dd>
                        </div>
                        $(if session-time-left)
                        <div class="auth-meta">
                            <dt class="k">time left:</dt>
                            <dd class="v mb-0">$(session-time-left)</dd>
                        </div>
                        $(endif)
                        <div class="auth-meta">
                            <dt class="k">bytes up/down:</dt>
                            <dd class="v mb-0">$(bytes-in-nice) / $(bytes-out-nice)</dd>
                        </div>
                    </dl>
                    <input type="submit" value="Login Hotspot" class="btn btn-primary btn-auth w-100">
                </main>
            </form>
            <footer class="auth-footer text-center text-white">
                <small>&copy; 2019 <a href="https://jurnalmuis.github.io/" target="_blank" class="font-weight-bold">jurnalmuis.github.io</a></small>
            </footer>
        </div>
    </div>
</body>
</html>
